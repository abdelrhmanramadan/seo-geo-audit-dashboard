<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Audit Dashboard · SEO, GEO, AEO</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap");
:root{--ink:#14211d;--mut:#6b7570;--line:#e3dfd3;--bg:#f4f1e8;--card:#fffdf8;--side:#0f1f1b;--acc:#0b7a5b;--acc2:#d9f26b;--track:#e7e2d4;--good:#0b7a5b;--warn:#b0780b;--bad:#c0392b;

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:15px/1.55 var(--body);color:var(--ink);background:var(--bg);display:grid;grid-template-columns:248px 1fr}
aside{background:var(--side);color:#dfe9e3;padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:30px;
background-image:radial-gradient(circle at 20% 0%,rgba(217,242,107,.13),transparent 45%),linear-gradient(180deg,#0f1f1b,#0b1714)}
.brand{display:flex;gap:11px;align-items:center}.mark{width:36px;height:36px;border-radius:10px;background:var(--acc2);display:grid;place-items:center;color:var(--side);font:700 16px var(--disp)}
.brand b{font:700 16px/1.15 var(--disp);letter-spacing:-.01em;display:block}.brand span{font-size:11.5px;color:#8fa59b;letter-spacing:.08em;text-transform:uppercase}

nav button:hover{background:rgba(255,255,255,.06);color:#fff}nav button.on{background:rgba(217,242,107,.14);color:var(--acc2)}
nav button:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.phead{margin-bottom:26px}.phead h1,.hinfo h1{font:700 34px/1.1 var(--disp);letter-spacing:-.025em;margin:0}.phead p{color:var(--mut);margin:8px 0 0;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:18px;box-shadow:0 1px 0 rgba(20,33,29,.03)}.card.narrow{max-width:720px}
h2{font:700 20px var(--disp);margin:0 0 12px}h3{font:700 17px var(--disp);margin:0 0 14px;display:flex;gap:12px;align-items:baseline}
h3 em{font:500 12px var(--mono);color:var(--acc);font-style:normal;letter-spacing:.06em}

input[type=file]{font:inherit}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 18px}

.dd{position:relative}.ddbtn{display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left}.ph{color:#9aa39e}.caret{color:var(--mut)}

.chip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px}.chip button:hover{background:rgba(10,92,69,.15)}
button.pri{background:var(--acc);color:#fff;border:0;padding:12px 22px;border-radius:11px;font:600 15px var(--body);cursor:pointer;transition:transform .12s,background .15s;box-shadow:0 6px 16px rgba(11,122,91,.25)}
button.pri:hover{background:#096a4f;transform:translateY(-1px)}button.sec{background:#fff;color:var(--acc);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font:500 14px var(--body);cursor:pointer;margin-top:8px}
button:disabled{opacity:.5;cursor:default;transform:none}.submit{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:6px}
.msg{padding:11px 14px;border-radius:10px;margin:12px 0;background:#e4f3ec;color:#0a5c45;font-weight:500}.msg.err{background:#fbe9e6;color:var(--bad)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:54px;text-align:center;color:var(--mut)}.empty b{font:700 20px var(--disp);color:var(--ink)}

.acard:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(20,33,29,.10);border-color:#cfc9b8}.ainfo{min-width:0;display:grid;gap:3px}

.hero .ringnum{fill:#fff}.hero{--track:rgba(255,255,255,.14)}.hinfo{flex:1;min-width:260px}.hinfo h1{color:#fff;font-size:38px}.hinfo p{margin:6px 0 0;color:#a9bdb3;font-size:14px}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc2)}.hero button.pri{background:var(--acc2);color:var(--side);box-shadow:none}.hero button.pri:hover{background:#e6fa8a}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.filters select{width:auto}

.t-google{background:#dff3ea;color:#0a5c45}.t-fail{background:#fbe3df;color:#8f2218}.t-pass{background:#dff3ea;color:#0a5c45}
.urls{max-height:440px;overflow:auto;background:#faf8f1;border:1px solid var(--line);border-radius:12px;margin-top:10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);position:sticky;top:0;background:#faf8f1}
.utable{font-size:13px}.utable td{word-break:break-word}.utable td:first-child{width:46%;font-family:var(--mono);font-size:12.5px}
.score{font-weight:700}.s-good{color:var(--good)}.s-mid{color:var(--warn)}.s-bad{color:var(--bad)}.s-na{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:3px}
.sub{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-top:10px}.sub span:last-child{white-space:nowrap}
.mut{color:var(--mut)}a{color:var(--acc)}.langrow{display:flex;gap:8px;margin-bottom:6px}.langrow input{flex:1}
@media(max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;padding:14px;flex-wrap:wrap}nav{flex-direction:row}.foot{display:none}main{padding:22px 16px 60px}.tiles{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<aside>
  <div class="brand"><div class="mark">A</div><div><b>Site Audit</b><span>SEO · GEO · AEO</span></div></div>
  <nav>
    <button data-v="audits" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Audits</button>
    <button data-v="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>New audit</button>
    <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </nav>
  <div class="foot">Scores use checks documented by Google. Other checks are shown as best practice.</div>
</aside>
<main id="app"></main>
<script>
"use strict";
const $ = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);

const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const cfg = () => ({ repo: store.get("dataRepo").trim(), token: store.get("token").trim() });
const app = document.getElementById("app");
let questions = null;

async function gh(path, opts = {}) {
  const { repo, token } = cfg();
  if (!repo || !token) throw new Error("Add the data repository and token in Settings first.");
  const r = await fetch(`https://api.github.com/repos/${repo}${path ? "/" + path : ""}`, { ...opts, headers: { Authorization: `Bearer ${token}`, Accept: opts.accept || "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) } });

  return r;
}
const raw = (p) => gh("contents/" + p.split("/").map(encodeURIComponent).join("/"), { accept: "application/vnd.github.raw+json" });
const cls = (s) => s == null ? "s-na" : s >= 80 ? "s-good" : s >= 50 ? "s-mid" : "s-bad";
const col = (s) => s == null ? "#c9c4b8" : s >= 80 ? "#0b7a5b" : s >= 50 ? "#c98a12" : "#c0392b";

const NS = "http://www.w3.org/2000/svg";

  svg.append(t); return svg;

const pageHead = (title, sub) => $("div", { class: "phead" }, $("h1", {}, title), sub ? $("p", {}, sub) : null);
const msg = (t, err) => $("div", { class: "msg" + (err ? " err" : "") }, t);

function show(view, arg) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view || (view === "result" && b.dataset.v === "audits")));
  app.replaceChildren();
  ({ audits: viewAudits, new: viewNew, settings: viewSettings, result: viewResult })[view](arg).catch(e => app.append(msg(e.message, true)));
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.v));

async function viewSettings() {
  const repo = $("input", { type: "text", value: store.get("dataRepo"), placeholder: "owner/seo-audit-data" });
  const tok = $("input", { type: "password", value: store.get("token"), placeholder: "github_pat_..." });
  const note = $("div");
  app.append(pageHead("Settings", "Connection to your private data repository."), $("div", { class: "card narrow" },
    $("p", { class: "help" }, "Audits run in your private data repository and results are read from it. The token is kept only in this browser and is sent only to api.github.com."),
    $("label", {}, "Private data repository"), repo,
    $("label", {}, "Fine-grained access token"), tok,
    $("p", { class: "help" }, "Token scope: only the data repository, with Contents (read and write) and Actions (read and write)."),
    $("button", { class: "pri", onclick: async () => {
      store.set("dataRepo", repo.value); store.set("token", tok.value);
      try { await gh(""); note.replaceChildren(msg("Saved. Connection to the repository works.")); } catch (e) { note.replaceChildren(msg("Saved, but the connection failed: " + e.message, true)); }
    } }, "Save and test"), note));
}

async function viewAudits() {
  app.append(pageHead("Audits", "Every domain you have analysed. Open one to see its issues, affected URLs and 12-month plan."));
  let idx;
  try { idx = await (await raw("audits/index.json")).json(); }
  catch (e) { app.append(e.status === 404 ? $("div", { class: "empty" }, $("b", {}, "No audits yet"), $("p", {}, "Start your first one from New audit.")) : msg(e.message, true)); return; }
  const grid = $("div", { class: "agrid" });
  idx.forEach((a, i) => grid.append($("button", { class: "acard", style: `animation-delay:${Math.min(i, 8) * 45}ms`, onclick: () => show("result", a) }, ring(a.overall, 72, 8),
    $("div", { class: "ainfo" }, $("b", {}, a.domain), $("span", {}, `${a.date.slice(0, 10)} · ${a.pages} pages`),
      $("div", { class: "pills" }, ...[["SEO", a.pillars.seo], ["GEO", a.pillars.geo], ["AEO", a.pillars.aeo], ["Local", a.pillars.local]].filter(x => x[1] != null).map(([n, v]) => $("span", { class: "pill" }, n + " ", $("i", { class: cls(v) }, fmt(v)))))))));
  app.append(grid);
}

const ISO = "AF AX AL DZ AS AD AO AI AQ AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BQ BA BW BV BR IO BN BG BF BI CV KH CM CA KY CF TD CL CN CX CC CO KM CG CD CK CR CI HR CU CW CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FK FO FJ FI FR GF PF TF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT HM VA HN HK HU IS IN ID IR IQ IE IM IL IT JM JP JE JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG NU NF MK MP NO OM PK PW PS PA PG PY PE PH PN PL PT PR QA RE RO RU RW BL SH KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI SB SO ZA GS SS ES LK SD SR SJ SE CH SY TW TJ TZ TH TL TG TK TO TT TN TR TM TC TV UG UA AE GB US UM UY UZ VU VE VN VG VI WF EH YE ZM ZW".split(" ");
function countryList() {
  let dn; try { dn = new Intl.DisplayNames(["en"], { type: "region" }); } catch { dn = null; }
  return ISO.map(c => [c, dn ? dn.of(c) : c]).sort((a, b) => a[1].localeCompare(b[1]));
}
function field(f, state) {
  const set = (v) => { state[f.id] = v; };

  if (f.type === "countries") {
    const picked = new Set(); set([]);
    const label = $("span", { class: "ph" }, "Select countries"), chips = $("div", { class: "chips" }), list = $("div", { class: "clist" });
    const sync = () => { const v = [...picked].sort(); set(v); label.textContent = v.length ? `${v.length} selected` : "Select countries"; label.className = v.length ? "" : "ph";
      chips.replaceChildren(...v.map(n => $("span", { class: "chip" }, n, $("button", { type: "button", "aria-label": "Remove " + n, onclick: () => { picked.delete(n); boxes[n].checked = false; sync(); } }, "\u00d7")))); };
    const boxes = {};
    const rows = countryList().map(([code, name]) => { const cb = $("input", { type: "checkbox", onchange: e => { e.target.checked ? picked.add(name) : picked.delete(name); sync(); } }); boxes[name] = cb; const el = $("label", { class: "chk" }, cb, name); list.append(el); return [name.toLowerCase(), el]; });
    const search = $("input", { type: "text", placeholder: "Search countries", oninput: e => { const q = e.target.value.trim().toLowerCase(); for (const [n, el] of rows) el.style.display = n.includes(q) ? "" : "none"; } });
    const panel = $("div", { class: "ddpanel", hidden: true }, search, list);
    const btn = $("button", { type: "button", class: "ddbtn", "aria-expanded": "false", onclick: () => { panel.hidden = !panel.hidden; btn.setAttribute("aria-expanded", String(!panel.hidden)); if (!panel.hidden) search.focus(); } }, label, $("span", { class: "caret" }, "\u25be"));

  }
  else if (f.type === "textarea") input = $("textarea", { oninput: e => set(e.target.value) });
  else { input = $("input", { type: f.type === "number" ? "number" : "text", placeholder: f.placeholder || "", value: f.default ?? "", oninput: e => set(f.type === "number" ? Number(e.target.value) : e.target.value) }); if (f.default != null) set(f.default); }
  return $("div", {}, $("label", {}, f.label), input);
}

async function viewNew() {
  if (!questions) questions = await (await fetch("intake/questions.json")).json();
  const st = { setup: {} }, langs = [];
  const domain = $("input", { type: "text", placeholder: "example.com" });
  const maxp = $("input", { type: "number", value: 500, min: 10, max: 5000 });
  const sf = $("input", { type: "file", accept: ".csv" });
  const form = $("div", { class: "form" });
  let sec = $("section", { class: "card" }, $("h3", {}, $("em", {}, "01"), "Website"), $("div", { class: "row" }, $("div", {}, $("label", {}, "Domain"), domain), $("div", {}, $("label", {}, "Maximum pages to crawl"), maxp)));
  form.append(sec); let n = 1;
  const langBox = $("div");
  const addLang = (code = "", prefix = "") => {
    const o = { code, prefix }; langs.push(o);
    langBox.append($("div", { class: "langrow" }, $("input", { type: "text", placeholder: "Language code, e.g. en", value: code, oninput: e => o.code = e.target.value.trim().toLowerCase() }),
      $("input", { type: "text", placeholder: "URL prefix, e.g. / or /ar", value: prefix, oninput: e => o.prefix = e.target.value.trim() })));
  };
  const setupItems = [];
  for (const s of questions.sections) {
    sec = $("section", { class: "card" }, $("h3", {}, $("em", {}, String(++n).padStart(2, "0")), s.title)); form.append(sec);
    if (s.help) sec.append($("p", { class: "help" }, s.help));
    if (s.type === "checklist") { const grid = $("div", { class: "checks" }); sec.append(grid); for (const i of s.items) {
      const el = $("label", { class: "chk" }, $("input", { type: "checkbox", onchange: e => st.setup[i.id] = e.target.checked }), i.label);
      setupItems.push([i, el]); grid.append(el);
    } } else if (s.type === "languages") sec.append(langBox, $("button", { class: "sec", onclick: () => addLang() }, "Add language"));
    else sec.append($("div", { class: "row" }, ...s.fields.map(f => { const el = field(f, st); el.addEventListener("change", refresh); return el; })));
  }
  let lastType;
  function refresh() {
    for (const [i, el] of setupItems) el.style.display = Object.entries(i.only_if || {}).every(([k, v]) => st[k] === v) ? "" : "none";
    if (st.site_type !== lastType) { lastType = st.site_type; form.querySelectorAll("select").forEach(x => { if (x.dependsOn === "site_type") x.fillFor(st.site_type); }); }
  }
  refresh();
  const note = $("div");
  const go = $("button", { class: "pri", onclick: run }, "Start audit");
  form.append($("section", { class: "card" }, $("h3", {}, $("em", {}, String(++n).padStart(2, "0")), "Screaming Frog export (optional)"),
    $("p", { class: "help" }, "In Screaming Frog: Internal tab > Filter: All > Export, as CSV. Pages the built-in crawler does not reach are added from this file. Maximum 25 MB."), sf),
    $("div", { class: "submit" }, go, note));
  app.append(pageHead("New audit", "Enter the domain, answer the questions, and the whole site is crawled and checked."), form);

  async function run() {
    try {
      const d = domain.value.trim();
      if (!/^(https?:\/\/)?[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(d)) throw new Error("Enter a valid domain.");
      go.disabled = true; note.replaceChildren(msg("Starting..."));
      const intake = { ...st, languages: langs.filter(l => l.prefix && l.code).map(l => ({ code: l.code, prefix: l.prefix.startsWith("/") ? l.prefix : "/" + l.prefix })),
        competitors: (st.competitors || "").split("\n").map(s => s.trim()).filter(Boolean) };
      let sfPath = "";
      if (sf.files[0]) {
        if (sf.files[0].size > 25e6) throw new Error("The Screaming Frog file is larger than 25 MB.");
        const b64 = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = no; fr.readAsDataURL(sf.files[0]); });
        sfPath = `uploads/${d.replace(/^https?:\/\//, "").replace(/[^a-z0-9.-]/gi, "_")}-${Date.now()}.csv`;
        await gh("contents/" + sfPath, { method: "PUT", body: JSON.stringify({ message: "Screaming Frog export", content: b64 }) });
      }
      await gh("actions/workflows/audit.yml/dispatches", { method: "POST", body: JSON.stringify({ ref: "main", inputs: { domain: d, intake: JSON.stringify(intake), sf_path: sfPath, max_pages: String(maxp.value || 500) } }) });
      note.replaceChildren(msg("Audit started. It usually takes 3 to 15 minutes depending on site size. It will appear under Audits when finished."),
        $("a", { href: `https://github.com/${cfg().repo}/actions`, target: "_blank", rel: "noopener" }, "Follow the run on GitHub"));
    } catch (e) { note.replaceChildren(msg(e.message, true)); }
    go.disabled = false;
  }
}

async function viewResult(a) {
  app.append(msg("Loading " + a.domain + "..."));
  const r = await (await raw(a.path + "/result.json")).json();
  app.replaceChildren();
  const m = r.meta, cov = m.coverage;
  const SEVS = ["critical", "high", "medium", "low"];
  const issues = r.checks.filter(c => ["fail", "warn"].includes(c.status) && SEVS.includes(c.severity))
    .sort((x, y) => SEVS.indexOf(x.severity) - SEVS.indexOf(y.severity) || (x.status === "fail" ? 0 : 1) - (y.status === "fail" ? 0 : 1) || y.count - x.count);
  const notRun = r.checks.filter(c => c.status === "not_run" || c.status === "error");
  const link = (u) => $("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, decodeURI(u).replace(/^https?:\/\//, ""));
  const safeLink = (u) => { try { return link(u); } catch { return $("span", {}, u); } };
  const dl = $("button", { class: "pri", onclick: async () => {
    const blob = await (await raw(a.path + "/plan.xlsx")).blob();
    const u = URL.createObjectURL(blob); const l = $("a", { href: u, download: `${m.domain}-seo-plan-${m.crawled_at.slice(0, 10)}.xlsx` }); document.body.append(l); l.click(); l.remove(); URL.revokeObjectURL(u);
  } }, "Download 12-month plan (.xlsx)");
  const gIssues = issues.filter(c => c.basis === "google").length;
  app.append($("div", { class: "hero" }, ring(r.scores.overall, 132, 12),
    $("div", { class: "hinfo" }, $("span", { class: "eyebrow" }, "Audit report"), $("h1", {}, m.domain),
      $("p", {}, `${m.crawled_at.slice(0, 10)} · ${m.pages_crawled} pages analysed` + (m.screaming_frog_pages ? ` (${m.screaming_frog_pages} from Screaming Frog)` : "") + (m.truncated ? " · crawl limit reached, raise Maximum pages to cover the whole site" : "")),
      $("p", {}, `Score is based only on checks documented by Google (${gIssues} of the ${issues.length} issues).`)),
    $("div", { class: "hside" }, dl)),
    $("div", { class: "tiles" }, ...SEVS.map(s => { const n = issues.filter(c => c.severity === s).length; return $("div", { class: "tile t-" + s }, $("b", {}, n), $("span", {}, s[0].toUpperCase() + s.slice(1))); })));

  const body = $("div"), tabs = $("div", { class: "tabs" });
  const views = { [`Issues (${issues.length})`]: drawIssues, [`Pages (${r.pages.length})`]: drawPages, "Scores": drawScores, [`Not checked (${notRun.length})`]: drawNotRun };
  Object.entries(views).forEach(([name, fn], i) => tabs.append($("button", { class: i ? "" : "on", onclick: e => { tabs.querySelectorAll("button").forEach(b => b.classList.remove("on")); e.target.classList.add("on"); body.replaceChildren(); fn(); } }, name)));
  app.append(tabs, body);
  drawIssues();

  function issueBlock(c) {
    const urls = c.items.length ? $("table", { class: "utable" }, $("tr", {}, $("th", {}, "URL"), $("th", {}, "What is wrong")),
      ...c.items.map(i => $("tr", {}, $("td", {}, safeLink(i.url)), $("td", {}, i.detail || "")))) : null;
    return $("details", {}, $("summary", {}, $("span", { class: "tag t-" + c.severity }, c.severity), $("b", {}, c.name),
        $("span", { class: "tag " + (c.basis === "google" ? "t-google" : "t-info") }, c.basis === "google" ? "Google" : "Best practice"), $("span", { class: "mut" }, c.summary), c.count ? $("span", { class: "tag t-info" }, c.count + (c.count === 1 ? " URL" : " URLs")) : null),
      $("div", { class: "det" }, $("p", {}, $("b", {}, "How to fix: "), c.fix), $("p", { class: "mut" }, $("b", {}, "Rule: "), c.test),
        $("p", { class: "mut" }, c.id + " · " + c.section_name + " / " + c.subsection_name + " · " + ({ google: "Google official", platform: "Platform official", industry: "Industry practice" })[c.basis] + ": ", $("a", { href: c.source_url, target: "_blank", rel: "noopener" }, c.source_title), c.verified ? ` · checked against the source page on ${c.verified}` : ""),
        urls ? $("div", { class: "urls" }, urls, c.count > c.items.length ? $("div", { class: "mut" }, `Showing ${c.items.length} of ${c.count}.`) : null) : null));
  }
  function drawIssues() {
    const sel = (opts) => $("select", { onchange: draw }, ...opts.map(([v, l]) => $("option", { value: v }, l)));
    const fSev = sel([["", "All severities"], ...SEVS.map(s => [s, s[0].toUpperCase() + s.slice(1)])]);
    const fPil = sel([["", "All areas"], ...r.scores.pillars.map(p => [p.id, p.name])]);
    const fSec = sel([["", "All sections"], ...[...new Set(issues.map(c => c.section_name))].map(s => [s, s])]);
    const fBasis = sel([["google", "Google-documented only"], ["", "All sources"], ["other", "Best practice only"]]);
    const q = $("input", { type: "text", placeholder: "Search issues or URLs", style: "width:240px", oninput: draw });
    const list = $("div");
    body.append($("div", { class: "card" }, $("div", { class: "filters" }, fBasis, fSev, fPil, fSec, q), list));
    function draw() {
      const t = q.value.trim().toLowerCase();
      const rows = issues.filter(c => (!fBasis.value || (fBasis.value === "google") === (c.basis === "google")) && (!fSev.value || c.severity === fSev.value) && (!fPil.value || c.pillar === fPil.value) && (!fSec.value || c.section_name === fSec.value) &&
        (!t || (c.name + " " + c.summary).toLowerCase().includes(t) || c.items.some(i => i.url.toLowerCase().includes(t))));
      list.replaceChildren(...(rows.length ? rows.map(issueBlock) : [$("p", { class: "mut" }, "No issues match.")]));
    }
    draw();
  }
  function drawPages() {
    const byId = Object.fromEntries(r.checks.map(c => [c.id, c]));
    const pages = [...r.pages].sort((x, y) => y.issues.length - x.issues.length);
    const q = $("input", { type: "text", placeholder: "Filter by URL", style: "width:320px", oninput: draw }), list = $("div"), note = $("span", { class: "mut" });
    body.append($("div", { class: "card" }, $("div", { class: "filters" }, q, note), list));
    function draw() {
      const t = q.value.trim().toLowerCase(), rows = pages.filter(p => !t || decodeURI(p.url).toLowerCase().includes(t));
      note.textContent = `${rows.length} pages` + (rows.length > 300 ? ", showing the 300 with most issues" : "");
      list.replaceChildren(...rows.slice(0, 300).map(p => $("details", {}, $("summary", {}, $("span", { class: "tag " + (p.status === 200 ? "t-pass" : "t-fail") }, p.status), safeLink(p.url), $("span", { class: "tag " + (p.issues.length ? "t-high" : "t-pass") }, p.issues.length + " issues"), p.title ? $("span", { class: "mut" }, p.title.slice(0, 70)) : null),
        $("div", { class: "det" }, ...(p.issues.length ? p.issues.map(id => { const c = byId[id], i = c.items.find(x => x.url === p.url); return $("p", {}, $("span", { class: "tag t-" + c.severity }, c.severity), " ", $("b", {}, c.name), i && i.detail ? ": " + i.detail : ""); }) : [$("p", { class: "mut" }, "No issues found by the automated checks.")])))));
    }
    draw();
  }
  function drawScores() {
    body.append($("p", { class: "mut" }, `${cov.ran} of ${cov.applicable} applicable checks ran automatically. Scores cover only those. Areas with no automated check yet are hidden here and listed under Not checked.`));
    const grid = $("div", { class: "grid" });
    for (const p of r.scores.pillars) {
      if (p.score == null) continue;
      const c = $("div", { class: "card", style: "margin:0" }, $("div", { style: "display:flex;justify-content:space-between" }, $("b", {}, p.name), $("span", { class: "score " + cls(p.score) }, fmt(p.score))));
      for (const s of p.sections.filter(s => s.score != null)) {
        c.append($("div", { class: "sub", style: "font-weight:600" }, $("span", {}, s.name), $("span", { class: cls(s.score) }, fmt(s.score))));
        for (const ss of s.subsections.filter(x => x.score != null)) c.append($("div", { class: "sub" }, $("span", {}, ss.name), $("span", { class: "mut" }, `${fmt(ss.score)} · ${ss.ran}/${ss.total} checks`)),
          $("div", { class: "bar" }, $("i", { style: `width:${ss.score}%;background:${col(ss.score)}` })));
      }
      grid.append(c);
    }
    body.append(grid);
    const langs = Object.entries(r.by_language || {});
    if (langs.length) body.append($("div", { class: "card", style: "margin-top:18px" }, $("h2", {}, "By language"),
      $("table", {}, $("tr", {}, ...["Language", "Pages", "Overall", "SEO", "GEO", "AEO"].map(h => $("th", {}, h))),
        ...langs.map(([k, v]) => $("tr", {}, $("td", {}, k), $("td", {}, v.pages), ...[v.overall, v.pillars.seo, v.pillars.geo, v.pillars.aeo].map(x => $("td", { class: "score " + cls(x) }, fmt(x))))))));
  }
  function drawNotRun() {
    const groups = {};
    for (const c of notRun) (groups[c.summary] ||= []).push(c);
    body.append($("p", { class: "mut" }, "These checks are in the catalog but could not be decided automatically in this run. They are listed in the plan file under Manual review."));
    for (const [why, cs] of Object.entries(groups).sort((x, y) => y[1].length - x[1].length))
      body.append($("div", { class: "card" }, $("h3", { style: "margin-top:0" }, `${why} (${cs.length})`), ...cs.map(c => $("details", {}, $("summary", {}, $("span", { class: "tag t-" + c.severity }, c.severity), $("b", {}, c.name), $("span", { class: "mut" }, c.id + " · " + c.section_name)), $("div", { class: "det" }, $("p", {}, c.test))))));
  }
}
show("audits");
</script>
